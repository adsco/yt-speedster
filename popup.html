<!DOCTYPE html>
<html>
	<head>
		<style>
			* {
				margin: 0;
				padding: 0;
			}
			
			body {
				background-color: #FFFFFF;
			}
			
			.header {
				background-color: #F44336;
				padding: 15px;
			}
			
			.title {
				text-transform: uppercase;
				white-space: nowrap;
				text-align: center;
				color: #FFFFFF;
			}
			
			#buttons-container {
				display: flex;
				padding: 15px 10px;
			}
			
			.button-speed {
				cursor: pointer;
				position: relative;
				display: block;
				margin-right: 10px;
				padding: 10px 15px;
				overflow: hidden;
				border-width: 0;
				outline: none;
				border-radius: 2px;
				box-shadow: 0 1px 4px rgba(0, 0, 0, .6);
				background-color: #2196F3;
				color: #ECF0F1;
				transition: background-color .3s;
			}
			
			.button-speed:hover {
				background-color: #0068BF;
			}
			
			.button-speed-active {
				background-color: #6EC5FF;
			}
			
			.button-speed:last-child {
				margin-right: 0;
			}
		</style>
	</head>
	<body>
		<div class="header">
			<h3 class="title">Set video playback speed</h3>
		</div>
		<div id="buttons-container"></div>
		<script src="popup.js"></script>
	</body>
</html>
